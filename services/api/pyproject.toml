[project]
name = "provenalt-api"
version = "0.1.0"
description = "Provenalt public API — FastAPI service exposing the free-tier read endpoints."
requires-python = ">=3.12"
dependencies = [
    "provenalt-shared",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["provenalt_api*"]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: hits a real database / running server; excluded from default runs",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "../../packages/shared"

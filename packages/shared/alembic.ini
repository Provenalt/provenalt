# Alembic configuration for the Provenalt database schema.
# The database URL is resolved at runtime in migrations/env.py (from DATABASE_URL),
# so no connection string is committed here (repo convention: no secrets in the repo).

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# sqlalchemy.url is intentionally left blank — env.py reads DATABASE_URL from the
# environment. Override for a one-off run with: alembic -x db_url=... upgrade head
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
